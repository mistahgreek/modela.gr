version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: modela_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - modela

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: modela_php
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - modela
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    container_name: modela_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: modela
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: modela
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - modela
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    container_name: modela_redis
    ports:
      - "6379:6379"
    networks:
      - modela
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit
    container_name: modela_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - modela

networks:
  modela:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
